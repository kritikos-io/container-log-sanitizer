name: Driver Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLUGIN_NAME: container-log-sanitizer-ci:${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
      - name: Unit, FIFO, RPC and race tests
        run: go test -race ./... -count=1 -timeout=120s
      - name: Static checks and build
        run: |
          go vet ./...
          bash -n build-plugin.sh
          bash -n canary.sh
          CGO_ENABLED=0 GOOS=linux go build -trimpath -o dist/container-log-sanitizer .
      - name: Install isolated test plugin
        run: sudo -n bash build-plugin.sh "$PLUGIN_NAME" "$RUNNER_TEMP/sanitizer-store"
      - name: Docker canaries for both backends
        run: |
          docker pull busybox:1.37.0
          sudo -n bash canary.sh "$PLUGIN_NAME" busybox:1.37.0 local
          sudo -n bash canary.sh "$PLUGIN_NAME" busybox:1.37.0 json-file
      - name: Remove test plugin
        if: always()
        run: |
          docker plugin disable "$PLUGIN_NAME" || true
          docker plugin rm "$PLUGIN_NAME" || true
